<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stormdrain" />
    <meta name="theme-color" content="#000000" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Stormdrain — a roguelike twin-stick crawl through the storm drains." />
    <title>Stormdrain</title>
    <style>
      html,
      body {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        touch-action: none;
      }
      #screen {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
        outline: none;
        touch-action: none;
      }
      /* Invisible probe: its padding resolves env(safe-area-inset-*) so JS can read the insets. */
      #safe-probe {
        position: fixed;
        inset: 0;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
      }
      noscript {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #ccc;
        font: 14px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" aria-label="Stormdrain"></canvas>
    <div id="safe-probe" aria-hidden="true"></div>
    <noscript>Stormdrain needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
